name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    # Commit tworzony przez semantic-release oznaczony jest "[skip ci]".
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@v4
        id: semantic
        with:
          # Zgodnie z wersją pluginów z .releaserc.json
          semantic_version: 24
          extra_plugins: |
            @semantic-release/changelog@6
            @semantic-release/git@10
            @semantic-release/github@11
            @ceski23/semantic-release-hacs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dodano nową wersję (tag + release)
        if: steps.semantic.outputs.new_release_published == 'true'
        run: echo "${{ steps.semantic.outputs.release_notes }}"